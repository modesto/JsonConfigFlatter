name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required by NuGet/login for trusted publishing

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack
      run: |
        dotnet pack --configuration Release --no-build -o out

    - name: NuGet login (OIDC trusted publishing)
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push generated package to NuGet
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate --no-symbols ./out/JsonConfigFlatter.*.nupkg
